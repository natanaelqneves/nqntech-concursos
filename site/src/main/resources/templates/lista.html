<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${meta})}"></head>
<body>
<header th:replace="~{base :: cabecalho}"></header>
<main id="conteudo" class="container">
    <div class="cabeca-pagina">
        <nav aria-label="Você está em"><ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Início</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${titulo}">Lista</li>
        </ol></nav>
        <h1 th:text="${titulo}">Concursos</h1>
        <p class="lead" th:text="${descricao}">Descrição</p>
    </div>

    <nav th:if="${!atalhos.isEmpty()}" aria-label="Refinar">
        <ul class="atalhos">
            <li th:each="a : ${atalhos}"><a th:href="${a.url()}"><span th:text="${a.nome()}">Local</span>
                <span class="contador" th:if="${a.quantidade() > 0}" th:text="${a.quantidade()}">0</span></a></li>
        </ul>
    </nav>

    <p th:if="${concursos.isEmpty()}" class="vazio">Nenhum concurso aberto ou previsto aqui no momento.</p>
    <div class="grade-cartoes" id="resultados">
            <th:block th:each="c : ${concursos}"><article th:replace="~{base :: cartao(${c})}"></article></th:block>
    </div>
</main>
<footer th:replace="~{base :: rodape}"></footer>
</body>
</html>
