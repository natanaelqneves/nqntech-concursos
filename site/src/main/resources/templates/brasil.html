<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head(${meta})}">
    <meta name="google-adsense-account" content="ca-pub-5630145382573940">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5630145382573940"
     crossorigin="anonymous"></script>
     </head>
<body>
<header th:replace="~{base :: cabecalho}"></header>
<main id="conteudo" class="largura">
    <nav class="trilha" aria-label="Você está em"><a href="/">Início</a> › <span>Por estado</span></nav>
    <h1>Concursos por região e estado</h1>
    <p>Os <span th:text="${nacionais}">0</span> concursos nacionais (como o CNU e os de órgãos federais com vagas no
        país todo) aparecem em todas as regiões e estados.</p>
    <section th:each="r : ${regioes}" class="regiao" th:attr="aria-labelledby=${'regiao-' + r.slug()}">
        <h2 th:id="${'regiao-' + r.slug()}"><a th:href="${'/regiao/' + r.slug() + '/'}" th:text="${r.nome()}">Região</a></h2>
        <ul class="estados">
            <li th:each="e : ${estados.get(r.codigo())}"><a th:href="${e.url()}" th:text="${e.nome()}">Estado</a>
                <span class="contador" th:if="${e.quantidade() > 0}" th:text="${'(' + e.quantidade() + ')'}">(0)</span></li>
        </ul>
    </section>
</main>
<footer th:replace="~{base :: rodape}"></footer>
</body>
</html>
