# Classificação da área de cada cargo (seção 4.1 do contexto).
#
# Como funciona (coletor/src/coletor/classificacao/areas.py):
# - textos e termos são comparados em minúsculas, sem acento e por palavra inteira ("ti" não casa com "ativo");
# - ordem de decisão:
#   1. termo `principal` no NOME do cargo (profissões que definem a área: "Professor de Informática" é educação);
#   2. qualquer termo na ESPECIALIDADE ("Analista Judiciário – TI" é TI);
#   3. qualquer termo no NOME do cargo;
#   4. termo `orgao` no nome do órgão ("Escriturário" do Banco do Brasil é bancária);
#   5. termo `genericos` no cargo ("Analista", "Técnico" sem mais nada → administrativa);
#   6. nada encontrado → OUTRAS, com aviso no log.
# - em cada passo vence o termo mais longo ("engenheiro agrônomo" ganha de "engenheiro"); empate → ordem deste
#   arquivo;
# - `excluir`: se algum desses termos aparece no texto avaliado, a área não vale para ele.
# Os códigos são os do catálogo concursos.area (migration V7). Mudou uma regra? Rode o coletor: a etapa
# "classificar" reclassifica tudo e só grava o que mudou.

# Abreviações comuns nos quadros das bancas ("Prof. de Arte", "Aux. Educacional"), expandidas antes de comparar.
