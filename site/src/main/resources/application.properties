spring.main.web-application-type=none
spring.main.banner-mode=off
spring.application.name=nqntech-site

# Conexão como site_app (só leitura; RLS mostra só concursos publicados). Valores reais vêm do ambiente.
spring.datasource.url=${SITE_DB_URL:jdbc:postgresql://localhost:5432/concursos}
spring.datasource.username=${SITE_DB_USER:site_app}
spring.datasource.password=${SITE_DB_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000

site.url-base=${SITE_URL_BASE:http://localhost:8080}
site.saida=${SITE_SAIDA:saida-site}
site.isencoes=${SITE_ISENCOES:../config/isencoes.yml}
