# Utilitário: sondagem do DOU (dados abertos). Roda só em push na branch
# captura/dou e grava o resultado nela; nunca na main.
name: captura-dou
on:
  push:
    branches: [captura/dou]
    paths: [scripts/captura/sondar_dou.py, .github/workflows/captura-dou.yml]
permissions:
  contents: write
concurrency:
  group: captura-dou
  cancel-in-progress: false
jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install requests
      - run: python scripts/captura/sondar_dou.py
      - name: Gravar o resultado na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f coletor/tests/fixtures/dou
          git commit -m "captura: sondagem DOU [skip ci]" || echo "nada novo"
          git pull --rebase || true; git push || echo "push falhou; ver o log"
